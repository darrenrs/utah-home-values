# hpi_ratio converts a Jan 1 (assessment-date) market value to the 2025 annual average:
#   hpi_ratio = [county_annual(2025) / county_annual(Y)] * [metro_avg(Y) / metro_jan1(Y)]
# where Y = assessed_value_year, metro_jan1(Y) = mean(metro Q4 of Y-1, metro Q1 of Y),
# and metro_avg(Y) = mean of the four metro quarters of Y.
# County annual: FHFA All-Transactions HPI, FRED ATNHPIUS{county FIPS}A.
# Metro quarterly: FHFA All-Transactions HPI, FRED ATNHPIUS{CBSA}Q (no quarterly county index exists).
# Metros use OMB 2023 delineations (FHFA since 2025Q1): Ogden = Davis, Morgan, Weber;
# Salt Lake City-Murray = Salt Lake, Tooele; Provo-Orem-Lehi = Utah, Juab; St. George = Washington.
# Values retrieved from FRED on 2026-10-16.

Davis:
  is_valid: true
  is_wasatch_front: true
  assessed_value_year: 2024
  latest_year_built_with_value: 2023
  latest_year_built_with_oug_set: 2021
  assessment_sales_ratio: 0.9673
  # ATNHPIUS49011A 306.40 / 300.38; Ogden ATNHPIUS36260Q avg 2024 428.56 / Jan 1 418.805
  hpi_ratio: 1.0438

